name: CI
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Typecheck, build, test and check formatting
        run: |
          docker run --rm -e HUSKY=0 -e ASTRO_TELEMETRY_DISABLED=1 -v "$PWD:/app" -w /app oven/bun:1.4.4@sha256:1d22548f177f4ff38e0c15baa3c2c46c6c2060ba2d1bc573bb4720b407548f1d sh -c 'bun install --frozen-lockfile && bun run typecheck && bun run build && bun run test && bun run format:check'
      - name: Test deployment hooks
        run: python3 -B -m unittest discover -s deploy -p 'test_*.py'
      - name: Test webhook receiver
        run: node --test deploy/receiver/server.test.mjs
      - name: Build and start production image
        run: |
          docker build -t theme-generator:ci --build-arg THEME_GENERATOR_REVISION="$GITHUB_SHA" .
          THEME_GENERATOR_IMAGE=theme-generator:ci docker compose config --quiet
          docker network create platform-web
          trap 'THEME_GENERATOR_IMAGE=theme-generator:ci docker compose down; docker network rm platform-web' EXIT
          THEME_GENERATOR_IMAGE=theme-generator:ci docker compose up -d --wait --wait-timeout 60
          docker exec theme-generator-web-1 wget -qO- http://127.0.0.1:8080/ | grep -q 'mpro5 Theme Generator'
      - name: Verify release headers, assets and caching
        run: |
          docker run -d --name theme-generator-verify -p 127.0.0.1:8080:8080 theme-generator:ci
          trap 'docker rm -f theme-generator-verify' EXIT
          python3 -B deploy/verify-runtime.py http://127.0.0.1:8080 "$GITHUB_SHA"
