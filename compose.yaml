name: theme-generator
services:
  web:
    image: ${THEME_GENERATOR_IMAGE:?Set THEME_GENERATOR_IMAGE to a release image}
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    cpus: 0.5
    pids_limit: 64
    networks:
      platform-web:
        aliases: [theme-generator]
    # Inherit the health check shipped with the application image.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
networks:
  platform-web:
    external: true
